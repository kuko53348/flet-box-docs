<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="viewport-fit=cover, width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="./src/assets/fonts/icons.css">
    <link rel="manifest" href="./manifest.json">
    <link rel="icon" href="./src/assets/icon-192.png" sizes="192x192" type="image/png">

    <title>FletBox Docs</title>
    <meta name="description" content="Documentation for FletBox, a zero-dependency declarative UI framework for vanilla JavaScript — web, Android and iOS from one codebase.">
    <meta name="keywords" content="fletbox, flet-box, framework, ui, vanilla-js, declarative, pwa, capacitor">
    <meta name="author" content="Maenys Javier Quesada Reyes">
    <meta name="color-scheme" content="light dark">
    <link rel="apple-touch-icon" href="./src/assets/icon-192.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta property="og:title" content="FletBox Docs">
    <meta property="og:description" content="Declarative, zero-dependency UI framework in vanilla JS — ship web, Android and iOS from one codebase.">
    <meta property="og:type" content="website">

    <!-- The static boot brand is the dark palette's `surface`, and it is the one
         value the whole shell shares: `manifest.json`, the Capacitor splash and
         both icon scripts repeat it. It cannot follow the reader's theme because
         it is read before any module runs — the engine rewrites `theme-color` to
         the live `surface` on every theme change, and the boot value is only the
         frame in between. Same rule as the generated app's shell. -->
    <meta name="theme-color" content="#131c2e">

    <style>
        * {
            -webkit-text-size-adjust: 100%;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: system-ui, sans-serif;
            overscroll-behavior-y: none;
        }

        /* Only the dark answer is worth hard-coding: the page ink and the panel
           colors come from the palette once the app boots, and the brief moment
           before that is the reader's own OS setting — the same test the engine's
           boot applies when nothing has been chosen yet. A light reader gets a
           light canvas; a dark reader gets no white flash. */
        @media (prefers-color-scheme: dark) {

            html,
            body {
                background-color: #131c2e;
            }
        }
    </style>
    <script type="importmap">
        {
            "imports": {
                "flet-box": "./node_modules/flet-box/src/index.js"
            }
        }
    </script>
</head>

<body>
    <div id="root"></div>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('service-worker.js')
                .then(reg => console.log('Service Worker registered', reg))
                .catch(err => console.log('Service Worker registration error', err));
        }
    </script>
    <script type="module" src="src/app.js"></script>
</body>

</html>
